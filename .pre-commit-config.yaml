repos:
  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args:
          - "-e"
          - "SC1091"  # Can't follow non-constant source (external files)
          - "-e"
          - "SC2155"  # Declare and assign separately (verbose for simple scripts)
          - "-e"
          - "SC2016"  # Expressions don't expand in single quotes (intentional for awk/sed)
          - "-e"
          - "SC2086"  # Double quote to prevent globbing (noisy in AWS CLI with controlled vars)
          - "-e"
          - "SC2034"  # Variable appears unused (false positives for exports/sourced scripts)

  # Python linting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]
      - id: ruff-format
        types: [python]
