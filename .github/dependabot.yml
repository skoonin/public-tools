version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    commit-message:
      prefix: "ci"

  # pip (for pre-commit hooks that use Python)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "quarterly"
    commit-message:
      prefix: "deps"
