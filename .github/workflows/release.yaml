name: Release

on:
  push:
    tags:
      - "*/v*"  # Matches tags like "git-cleanup/v1.0.0"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TOOL_NAME="${TAG%/v*}"
          VERSION="${TAG#*/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tool=$TOOL_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tool exists
        env:
          TOOL: ${{ steps.parse.outputs.tool }}
        run: |
          if [ ! -d "$TOOL" ]; then
            echo "Error: Tool directory '$TOOL' does not exist"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.parse.outputs.tool }} ${{ steps.parse.outputs.version }}"
          tag_name: ${{ steps.parse.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.parse.outputs.tool }}/*
