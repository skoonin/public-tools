name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Verify scripts are executable
        run: |
          # Dynamically find all tools (directories with matching executable)
          found=0
          for dir in */; do
            tool=$(basename "$dir")
            script="$dir$tool"
            if [[ -f "$script" ]]; then
              if [[ ! -x "$script" ]]; then
                echo "ERROR: $script is not executable"
                exit 1
              fi
              echo "✓ $script is executable"
              found=$((found + 1))
            fi
          done
          if [[ $found -eq 0 ]]; then
            echo "ERROR: No tools found"
            exit 1
          fi
          echo "All $found scripts are executable"

      - name: Verify scripts have valid syntax
        run: |
          # Dynamically check syntax based on shebang
          for dir in */; do
            tool=$(basename "$dir")
            script="$dir$tool"
            if [[ -f "$script" ]]; then
              shebang=$(head -n1 "$script")
              if [[ "$shebang" == *"bash"* ]] || [[ "$shebang" == *"/sh"* ]]; then
                bash -n "$script" && echo "✓ $script (bash)"
              elif [[ "$shebang" == *"python"* ]]; then
                python -m py_compile "$script" && echo "✓ $script (python)"
              else
                echo "⚠ $script (unknown shebang: $shebang)"
              fi
            fi
          done
